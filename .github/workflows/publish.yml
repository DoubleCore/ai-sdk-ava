name: Publish to npm

# Release-only: publish runs on version tags (v*) or an explicit manual run.
# It never runs on branch pushes or PRs.
on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    # Manual releases must start from main; tag releases are verified below.
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      # Trusted publishing requires Node >=22.14.0 and npm >=11.5.1.
      # Pin npm explicitly instead of relying on the version bundled with Node.
      - name: Install npm with trusted publishing support
        run: |
          npm install --global npm@11.21.2
          npm --version

      - name: Verify tag matches package version
        if: github.event_name == 'push'
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          if [[ "${GITHUB_REF_NAME}" != "v${package_version}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} must exactly match v${package_version}."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Verify package contents
        run: npm pack --dry-run

      # OIDC-based npm provenance (trusted publishing). No NPM_TOKEN required:
      # the npm registry verifies the GitHub Actions OIDC token against the
      # trusted publisher configured on npmjs.com for this package.
      - name: Publish to npm
        run: npm publish --provenance --access public
